<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>机队总览 · HyicoPlatform</title>

    <script>
    /* 首屏防闪白：必须在任何样式表之前同步执行。与 login.html 完全一致。 */
    (function () {
        document.documentElement.classList.add('has-js');
        try {
            var saved = localStorage.getItem('hyico-theme');
            var dark = saved ? saved === 'dark'
                             : window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
            document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) { /* 隐私模式下静默忽略 */ }
    })();
    </script>

    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/dashboard.css" />
</head>
<body>
    <nav class="nav" id="topNav" aria-label="主导航"></nav>

    <main class="page">
        <header class="page__head">
            <h1 class="page__title" id="pageTitle">机队总览</h1>
            <p class="page__subtitle" id="pageSubtitle"></p>
        </header>

        <section class="stats" id="statsBar" aria-label="机队统计"></section>

        <div class="toolbar">
            <span class="toolbar__hint" id="connHint"></span>
            <button class="btn btn--ghost" id="refreshBtn" type="button">刷新</button>
        </div>

        <section class="drone-grid" id="droneGrid" aria-live="polite"></section>
    </main>

    <script src="./js/common.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/dashboard.js"></script>
</body>
</html>
